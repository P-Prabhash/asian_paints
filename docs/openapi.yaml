openapi: 3.0.3
info:
  title: Paint Shop & Sunnam Bags ERP Backend API
  description: Complete RESTful API contract for Paint Shop POS, Billing, Products, Customers, Inventory, Purchases, Reports, and System Administration.
  version: 1.0.0
servers:
  - url: https://asian-paints-buf0.onrender.com/api/v1
    description: Production Server
paths:
  /health/live:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: Service is live

  /health/ready:
    get:
      summary: Readiness health check (checks DB)
      responses:
        '200':
          description: Service and database ready
        '503':
          description: Database unavailable

  /auth/first-run-admin:
    post:
      summary: Create initial administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name: { type: string, example: Admin User }
                username: { type: string, example: admin }
                email: { type: string, example: admin@paintshop.com }
                password: { type: string, example: AdminPass123! }
      responses:
        '201': { description: Admin account created }
        '403': { description: Admin already exists }

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: AdminPass123! }
      responses:
        '200': { description: Login successful, returns JWT bearer token }
        '401': { description: Invalid credentials }

  /auth/logout:
    post:
      summary: User logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked }

  /auth/me:
    get:
      summary: Get current authenticated user details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile and permissions }

  /products/lookup:
    get:
      summary: Fast SKU or barcode scanner lookup for POS
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
          description: Barcode, SKU, or product name
      responses:
        '200': { description: Matching sellable products }

  /products:
    get:
      summary: List products with search and category filter
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Search products by SKU, barcode, or name
        - in: query
          name: categoryId
          schema: { type: integer }
          description: Filter by category ID
        - in: query
          name: activeOnly
          schema: { type: boolean, default: false }
          description: Return only active products
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Number of products per page (maximum 100)
      responses:
        '200': { description: Product catalog }
    post:
      summary: Create new product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, categoryId, unitId, gstRateId, purchasePrice, salePrice]
              properties:
                sku: { type: string, example: SKU-001 }
                barcode: { type: string, nullable: true, example: "8901234567890" }
                name: { type: string, minLength: 2, example: Premium Interior Paint }
                categoryId: { type: integer, minimum: 1, example: 1 }
                brand: { type: string, nullable: true, example: Asian Paints }
                size: { type: string, nullable: true, example: 20 L }
                shade: { type: string, nullable: true, example: White }
                hsnCode: { type: string, nullable: true, example: "32091090" }
                unitId: { type: integer, minimum: 1, example: 1 }
                gstRateId: { type: integer, minimum: 1, example: 1 }
                purchasePrice: { type: number, minimum: 0, example: 1200 }
                salePrice: { type: number, minimum: 0, example: 1500 }
                reorderLevel: { type: number, minimum: 0, default: 10, example: 5 }
                stockAlertDescription: { type: string, maxLength: 255, nullable: true, example: "Restock when remaining stock reaches minimum level" }
                stockQty: { type: number, default: 0, example: 20 }
                active: { type: boolean, default: true, example: true }
      responses:
        '201': { description: Product created }

  /products/{id}:
    get:
      summary: Get product by ID
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Product details }
    patch:
      summary: Update product details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Product updated }

  /billing/quote:
    post:
      summary: Calculate invoice totals and GST breakdown without persisting
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Quote calculation preview }

  /billing/checkout:
    post:
      summary: Process checkout, allocate invoice, deduct stock, record payments
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      responses:
        '201': { description: Invoice created }

  /sales:
    get:
      summary: List sales invoices
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Sales invoices list }

  /sales/{id}:
    get:
      summary: Get sale invoice details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Invoice details }

  /sales/{id}/returns:
    post:
      summary: Process sales return and stock reversal
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Return processed }

  /customers:
    get:
      summary: List customers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer list }
    post:
      summary: Register customer
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Customer registered }

  /customers/{id}/ledger:
    get:
      summary: View customer debit/credit ledger
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer ledger history }

  /customers/{id}/collections:
    post:
      summary: Collect credit instalment payment and issue receipt
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Collection receipt created }

  /stock:
    get:
      summary: View current stock levels
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stock levels }

  /stock/movements:
    get:
      summary: View stock movement history
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stock movement logs }

  /stock/adjustments:
    post:
      summary: Perform manual stock adjustment
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Stock adjusted }

  /purchases:
    get:
      summary: List supplier purchases
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Purchases list }
    post:
      summary: Receive supplier purchase
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Purchase recorded and stock incremented }

  /reports/dashboard:
    get:
      summary: Get store summary KPIs and sales trends
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard summary }

  /settings:
    get:
      summary: Get shop settings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings map }
    patch:
      summary: Update shop settings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings updated }

  /backups:
    post:
      summary: Create database backup
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Backup created }
    get:
      summary: List backups metadata
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Backups list }

  /backups/{id}/restore:
    post:
      summary: Restore database from backup
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Backup restored }

  /audit-logs:
    get:
      summary: View audit logs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Audit logs }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
