            previousStock: { type: number, example: 10.5 }
            newStock: { type: number, example: 16 }
            lowStock: { type: boolean, example: false }
            adjustmentType: { type: string, enum: [ADD, REMOVE, SET], description: Canonical operation returned by the API; INCREASE and DECREASE requests are normalized to ADD and REMOVE., example: ADD }
            reason: { type: string, example: "Physical stock count correction" }
        meta:
          type: object
          properties:
            requestId: { type: string }
