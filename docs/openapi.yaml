openapi: 3.0.3
info:
  title: Paint Shop & Sunnam Bags ERP Backend API
  description: Complete RESTful API contract for Paint Shop POS, Billing, Products, Customers, Inventory, Purchases, Reports, and System Administration.
  version: 1.0.0
servers:
  - url: https://asian-paints-buf0.onrender.com/api/v1
    description: Production Server
paths:
  /health/live:
    get:
      summary: Liveness health check
      responses:
        '200':
          description: Service is live

  /health/ready:
    get:
      summary: Readiness health check (checks DB)
      responses:
        '200':
          description: Service and database ready
        '503':
          description: Database unavailable

  /auth/first-run-admin:
    post:
      summary: Create initial administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, password]
              properties:
                name: { type: string, example: Admin User }
                username: { type: string, example: admin }
                email: { type: string, example: admin@paintshop.com }
                password: { type: string, example: AdminPass123! }
      responses:
        '201': { description: Admin account created }
        '403': { description: Admin already exists }

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, example: AdminPass123! }
      responses:
        '200': { description: Login successful, returns JWT bearer token }
        '401': { description: Invalid credentials }

  /auth/logout:
    post:
      summary: User logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Session revoked }

  /auth/me:
    get:
      summary: Get current authenticated user details
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User profile and permissions }

  /products/lookup:
    get:
      summary: Fast SKU or barcode scanner lookup for POS
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
          description: Barcode, SKU, or product name
      responses:
        '200': { description: Matching sellable products }

  /products:
    get:
      summary: List products with search and category filter
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Search products by SKU, barcode, or name
        - in: query
          name: categoryId
          schema: { type: integer }
          description: Filter by category ID
        - in: query
          name: activeOnly
          schema: { type: boolean, default: false }
          description: Return only active products
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Number of products per page (maximum 100)
      responses:
        '200': { description: Product catalog }
    post:
      summary: Create new product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, categoryId, unitId, gstRateId, purchasePrice, salePrice]
              properties:
                sku: { type: string, example: SKU-001 }
                barcode: { type: string, nullable: true, example: "8901234567890" }
                name: { type: string, minLength: 2, description: Manually entered product name., example: Premium Interior Paint }
                categoryId: { type: integer, minimum: 1, example: 1 }
                brand: { type: string, nullable: true, example: Asian Paints }
                size: { type: string, nullable: true, example: 20 L }
                shade: { type: string, nullable: true, example: White }
                hsnCode: { type: string, nullable: true, example: "32091090" }
                unitId: { type: integer, minimum: 1, example: 1 }
                gstRateId: { type: integer, minimum: 1, example: 1 }
                purchasePrice: { type: number, minimum: 0, example: 1200 }
                salePrice: { type: number, minimum: 0, example: 1500 }
                reorderLevel: { type: number, minimum: 0, default: 10, example: 5 }
                stockAlertDescription: { type: string, maxLength: 255, nullable: true, example: "Restock when remaining stock reaches minimum level" }
                stockQty: { type: number, default: 0, example: 20 }
                active: { type: boolean, default: true, example: true }
      responses:
        '201': { description: Product created }

  /products/{id}:
    get:
      summary: Get product by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404': { description: Product not found }
    patch:
      summary: Update product details
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Product updated and the saved product returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400': { description: Invalid product fields or related category, unit, or GST rate }
        '404': { description: Product not found }
        '409': { description: SKU or barcode already exists }

  /billing/products:
    get:
      summary: List active products available for POS billing
      description: Paginated catalog for the sales screen. Filter by Paint or Sunnam; use pagination to display the full matching catalog. Prices include calculated GST in salePriceIncludingGst.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: categoryFilter
          schema: { type: string, enum: [ALL, PAINT, SUNNAM], default: ALL }
          description: Paint and Sunnam catalog filters; ALL returns all active products.
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: POS product page with tax-inclusive display prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingProductListResponse'

  /billing/quote:
    post:
      summary: Calculate GST-inclusive invoice totals without persisting
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingQuoteRequest'
      responses:
        '200':
          description: GST breakdown and inclusive line and invoice totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingQuoteResponse'
        '400': { description: Invalid cart, inactive product, or mixed-category invoice }

  /billing/checkout:
    post:
      summary: Process category-specific checkout using a manually entered invoice number
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
          description: Optional key to safely retry the same checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCheckoutRequest'
      responses:
        '201':
          description: Invoice created with the supplied unique invoice number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingCheckoutResponse'
        '400': { description: Invalid cart, mixed categories, insufficient stock, or payment mismatch }
        '409': { description: Invoice number already exists }

  /sales:
    get:
      summary: List sales invoices, including Paint and Sunnam invoices
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: customerId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: paymentStatus
          schema: { type: string, enum: [PAID, PARTIAL, UNPAID] }
        - in: query
          name: categoryFilter
          schema: { type: string, enum: [PAINT, SUNNAM] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated invoice summaries with persisted GST totals and category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesListResponse'

  /sales/{id}:
    get:
      summary: Get sale invoice details by internal sale ID or invoice number
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          description: Internal numeric sale ID or exact manually assigned invoice number.
          schema: { type: string, example: PNT-2026-001 }
      responses:
        '200':
          description: Invoice with product snapshots, GST details, payments, and returns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '404': { description: Invoice not found }
    delete:
      summary: Void a sale and reverse unreturned stock while retaining transaction history
      description: Voids the sale instead of hard-deleting it. Existing payments and return records are retained; payment refunds must be recorded separately. Customer credit reversal is capped at the remaining balance because customer-level collections are not allocated to individual invoices.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          description: Internal numeric sale ID or exact manually assigned invoice number.
          schema: { type: string, example: PNT-2026-001 }
      responses:
        '200':
          description: Sale voided and stock restored transactionally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleVoidResponse'
        '404': { description: Sale not found }
        '409': { description: Sale already voided or stock/history integrity conflict }

  /sales/{id}/receipt:
    get:
      summary: Get an 80mm thermal-printer invoice by sale ID or invoice number
      description: Returns print-ready HTML sized for an 80mm thermal receipt printer. Open the response in a browser and choose Print.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          description: Internal numeric sale ID or exact manually assigned invoice number.
          schema: { type: string, example: PNT-2026-001 }
      responses:
        '200':
          description: Print-ready 80mm invoice receipt
          content:
            text/html:
              schema: { type: string }
        '404': { description: Invoice not found }

  /sales/{id}/returns:
    post:
      summary: Process sales return and stock reversal
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          description: Internal numeric sale ID or exact manually assigned invoice number.
          schema: { type: string, example: PNT-2026-001 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReturnRequest'
      responses:
        '201':
          description: Return recorded with stock and customer balance updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReturnResponse'
        '400': { description: Invalid return or quantity exceeds amount sold }

  /customers:
    get:
      summary: List customers
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer list }
    post:
      summary: Register customer with contact, address, and account details
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created and returned with persisted details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Customer'
                  meta:
                    type: object
                    properties:
                      requestId: { type: string }
        '400': { description: Invalid customer details }
        '409': { description: Customer code or mobile number already exists }

  /customers/{id}:
    get:
      summary: Get customer by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Customer details }
        '404': { description: Customer not found }
    patch:
      summary: Update customer contact, address, and account details
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200': { description: Customer updated }
        '404': { description: Customer not found }
    delete:
      summary: Delete (archive) a customer while retaining sales and ledger history
      description: Sets the customer inactive so it no longer appears in the active customer list. Historical invoices, receipts, and ledger entries are preserved.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Customer archived successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Customer deleted successfully." }
                  data:
                    type: object
                    properties:
                      id: { type: integer, example: 25 }
                      name: { type: string }
                      customerCode: { type: string, nullable: true }
                      deleted: { type: boolean, example: true }
                  meta:
                    type: object
                    properties:
                      requestId: { type: string }
        '404': { description: Customer not found or already archived }

  /customers/{id}/ledger:
    get:
      summary: View customer debit/credit ledger
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Customer ledger history }

  /customers/{id}/collections:
    post:
      summary: Collect a credit instalment with a manually entered receipt number
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPaymentRequest'
      responses:
        '201':
          description: Collection receipt created with the supplied unique receipt number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionPaymentResponse'
        '400': { description: Invalid collection request }
        '404': { description: Customer not found }
        '409': { description: Receipt number already exists }

  /stock:
    get:
      summary: View current stock levels
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Search by product name, SKU, or barcode
        - in: query
          name: categoryId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: lowStock
          schema: { type: boolean, default: false }
          description: Include only products at or below their reorder level
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Current inventory quantities, including products with zero stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockListResponse'

  /stock/movements:
    get:
      summary: View stock movement history
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: productId
          schema: { type: integer, minimum: 1 }
        - in: query
          name: movementType
          schema:
            type: string
            enum: [INITIAL_STOCK, PURCHASE_RECEIPT, PURCHASE_EDIT_IN, PURCHASE_EDIT_OUT, PURCHASE_VOID_OUT, SALE_OUT, SALE_RETURN_IN, SALE_VOID_IN, MANUAL_ADJUSTMENT]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Paginated stock movement history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementListResponse'

  /stock/adjustments:
    post:
      summary: Adjust stock quantity and record the inventory movement
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '200':
          description: Stock quantity updated and movement recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentResponse'
        '400': { description: Invalid adjustment or insufficient stock }
        '404': { description: Product not found }

  /purchases:
    get:
      summary: List supplier purchases
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Purchases list }
    post:
      summary: Receive supplier purchase, persist purchase and items, and increase stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequest'
      responses:
        '201':
          description: Purchase persisted and returned after the transaction commits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePurchaseResponse'
        '400': { description: Invalid supplier, product, or purchase details }
  /purchases/{id}:
    get:
      summary: View a purchase with persisted line items
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Purchase header, supplier, and item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePurchaseResponse'
        '404': { description: Purchase not found }
    put:
      summary: Edit a completed purchase and reconcile stock by item quantity difference
      description: Replaces the purchase header and item list. The stock delta and purchase changes are committed atomically; edits are rejected if reducing quantities would make stock negative.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseRequest'
      responses:
        '200':
          description: Updated purchase returned with persisted line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePurchaseResponse'
        '400': { description: Invalid supplier, product, or purchase details }
        '404': { description: Purchase not found }
        '409': { description: Purchase is voided or stock cannot be reduced safely }
    delete:
      summary: Void a purchase and reverse received stock while retaining history
      description: Does not hard-delete accounting history. Voiding fails if the received quantity has already been consumed and removing it would make stock negative.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Purchase voided and stock reversed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseVoidResponse'
        '404': { description: Purchase not found }
        '409': { description: Purchase already voided or stock has been consumed }

  /reports/dashboard:
    get:
      summary: Get store summary KPIs and sales trends
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Dashboard summary }

  /settings:
    get:
      summary: Get shop settings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings map }
    patch:
      summary: Update shop settings
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Settings updated }

  /backups:
    post:
      summary: Create database backup
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Backup created }
    get:
      summary: List backups metadata
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Backups list }

  /backups/{id}/restore:
    post:
      summary: Restore database from backup
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Backup restored }

  /audit-logs:
    get:
      summary: View audit logs
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Audit logs }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BillingProductListResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 12 }
              sku: { type: string, example: PAINT-001 }
              barcode: { type: string, nullable: true }
              name: { type: string, example: "Interior Paint" }
              category_id: { type: integer, example: 1 }
              category_name: { type: string, example: Paint }
              salesCategory: { type: string, enum: [PAINT, SUNNAM, BAGS, TOOLS_ACCESSORIES] }
              brand: { type: string, nullable: true }
              size: { type: string, nullable: true }
              shade: { type: string, nullable: true }
              hsn_code: { type: string, nullable: true }
              unit_code: { type: string, example: LTR }
              unit_name: { type: string, example: Litre }
              gst_rate: { type: number, example: 18 }
              stock_qty: { type: string, example: "12.00" }
              sale_price: { type: string, description: "Tax-exclusive selling price stored for tax calculation", example: "100.00" }
              salePriceIncludingGst: { type: number, description: "Display unit price inclusive of GST", example: 118 }
              active: { type: integer, enum: [0, 1] }
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    BillingQuoteRequest:
      type: object
      required: [items]
      properties:
        categoryFilter: { type: string, enum: [ALL, PAINT, SUNNAM], default: ALL }
        isInterState: { type: boolean, default: false }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, qty]
            properties:
              productId: { type: integer, minimum: 1, example: 12 }
              qty: { type: number, minimum: 0, exclusiveMinimum: true, example: 2 }
              discount: { type: number, minimum: 0, default: 0, example: 0 }
    BillingQuoteResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            categoryFilter: { type: string, example: PAINT }
            isInterState: { type: boolean, example: false }
            pricesIncludeGst: { type: boolean, example: true }
            items:
              type: array
              items:
                type: object
                properties:
                  productId: { type: integer }
                  name: { type: string }
                  sku: { type: string }
                  qty: { type: number }
                  unitPrice: { type: number, description: "Stored tax-exclusive unit price" }
                  unitPriceInclusive: { type: number, description: "Unit display price including GST" }
                  discount: { type: number }
                  taxableValue: { type: number }
                  gstRate: { type: number }
                  totalTax: { type: number }
                  cgst: { type: number }
                  sgst: { type: number }
                  igst: { type: number }
                  lineTotal: { type: number, description: "Line amount inclusive of GST and after discount" }
            subtotal: { type: number }
            discountTotal: { type: number }
            taxableTotal: { type: number }
            cgstTotal: { type: number }
            sgstTotal: { type: number }
            igstTotal: { type: number }
            roundOff: { type: number }
            grandTotal: { type: number, description: "Final amount payable, inclusive of GST" }
        meta:
          type: object
          properties:
            requestId: { type: string }
    BillingCheckoutRequest:
      allOf:
        - $ref: '#/components/schemas/BillingQuoteRequest'
        - type: object
          required: [invoiceNo, payments]
          properties:
            invoiceNo:
              type: string
              minLength: 1
              maxLength: 50
              pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]*$'
              description: Manually assigned unique invoice number. It is not generated by the server.
              example: PNT-2026-001
            customer:
              type: object
              nullable: true
              properties:
                id: { type: integer, nullable: true }
                name: { type: string, nullable: true }
                mobile: { type: string, nullable: true }
                address: { type: string, nullable: true }
                gstin: { type: string, nullable: true }
            payments:
              type: array
              minItems: 1
              items:
                type: object
                required: [method, amount]
                properties:
