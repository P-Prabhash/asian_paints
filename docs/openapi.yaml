    StockAdjustmentRequest:
      type: object
      required: [productId, adjustmentType, quantity, reason]
      properties:
        productId:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string, pattern: '^[1-9]\d*$' }
          example: 12
        adjustmentType:
          type: string
          enum: [INCREASE, DECREASE, ADD, REMOVE, SET]
          description: INCREASE is an alias for ADD; DECREASE is an alias for REMOVE. ADD/REMOVE take a positive delta; SET takes the target on-hand quantity and may be zero.
          example: INCREASE
        quantity:
          oneOf:
            - { type: number, minimum: 0, maximum: 9999999999.99 }
            - { type: string, pattern: '^\d+(\.\d{1,2})?$' }
          example: 5.5
        reason: { type: string, minLength: 3, maxLength: 255, example: "Physical stock count correction" }
